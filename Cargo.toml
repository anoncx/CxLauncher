[package]
name = "cxlauncher"
version = "0.1.0"
description = "A fast, native Minecraft launcher for the CxVisuals client"
authors = ["CxLauncher"]
edition = "2021"

[dependencies]
slint = { version = "1.18", default-features = false, features = [
  "std",
  "compat-1-2",
  "backend-winit",
  "renderer-femtovg",
  "renderer-skia",
  "accessibility",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
rfd = "0.17"
arboard = { version = "3", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "webp", "jpeg"] }
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "platform-verifier"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
fastrand = "2.5.0"
open = "5.4.4"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
flate2 = "1"

[build-dependencies]
slint-build = "1.18"
winresource = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_SystemInformation"] }

[package.metadata.packager]
product-name = "CxLauncher"
identifier = "dev.cxlauncher.app"
category = "Game"
icons = ["assets/32x32.png", "assets/128x128.png", "assets/icon.png", "assets/icon.ico"]
before-packaging-command = "cargo build --release"
out-dir = "target/packages"
formats = ["nsis", "deb", "appimage"]

[package.metadata.packager.deb]
depends = ["libfontconfig1", "libxkbcommon0", "libxkbcommon-x11-0"]
